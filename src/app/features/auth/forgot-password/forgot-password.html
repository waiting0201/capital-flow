@if (!emailSent()) {
  <!-- ══════ Step 1: Enter Email ══════ -->
  <div class="forgot-card">
    <!-- Header -->
    <div class="forgot-header">
      <div class="forgot-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <h2 class="forgot-title">忘記密碼</h2>
      <p class="forgot-desc">輸入您的電子郵件，我們將寄送密碼重設連結給您</p>
    </div>

    <!-- Error -->
    @if (errorMessage()) {
      <div class="forgot-error">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
          <path d="M8 4.5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="forgot-form">
      <div class="form-field" [class.has-error]="emailInvalid" [class.has-value]="form.controls.email.value">
        <label class="form-label" for="forgot-email">電子郵件</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="4" width="20" height="16" rx="3" />
            <path d="M2 7l10 6 10-6" />
          </svg>
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="your@email.com">
        </div>
        @if (emailInvalid) {
          <span class="form-error">請輸入有效的電子郵件地址</span>
        }
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>寄送中…</span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>寄送重設連結</span>
        }
      </button>
    </form>

    <!-- Back to login -->
    <a routerLink="/auth/login" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回登入
    </a>
  </div>
} @else {
  <!-- ══════ Step 2: Email Sent ══════ -->
  <div class="forgot-card">
    <div class="forgot-header">
      <div class="forgot-icon-wrap sent">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 2L11 13"/>
          <path d="M22 2L15 22l-4-9-9-4z"/>
        </svg>
      </div>
      <h2 class="forgot-title">郵件已寄出</h2>
      <p class="forgot-desc">
        我們已將密碼重設連結寄送至<br>
        <strong class="sent-email">{{ sentEmail() }}</strong>
      </p>
    </div>

    <div class="sent-instructions">
      <div class="instruction-row">
        <span class="instruction-num">1</span>
        <span>開啟您的信箱，尋找來自 Capital Flow 的郵件</span>
      </div>
      <div class="instruction-row">
        <span class="instruction-num">2</span>
        <span>點擊郵件中的「重設密碼」按鈕</span>
      </div>
      <div class="instruction-row">
        <span class="instruction-num">3</span>
        <span>設定新密碼後即可登入</span>
      </div>
    </div>

    <div class="resend-area">
      <p class="resend-text">沒有收到郵件？</p>
      <button
        class="btn-resend"
        [disabled]="cooldown() > 0 || isLoading()"
        (click)="resendEmail()">
        @if (cooldown() > 0) {
          {{ cooldown() }} 秒後可重新寄送
        } @else {
          重新寄送
        }
      </button>
    </div>

    <a routerLink="/auth/login" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回登入
    </a>
  </div>
}
