<div class="login-card" [class.shake]="errorMessage()">
  <!-- Header -->
  <div class="login-header">
    <h2 class="login-title">歡迎回來</h2>
    <p class="login-desc">登入您的投資帳戶，掌握市場脈動</p>
  </div>

  <!-- Error Message -->
  @if (errorMessage()) {
    <div class="login-error">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Form -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
    <!-- Email -->
    <div class="form-field" [class.has-error]="emailInvalid" [class.has-value]="form.controls.email.value">
      <label class="form-label" for="email">電子郵件</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="3" />
          <path d="M2 7l10 6 10-6" />
        </svg>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="your@email.com"
        />
      </div>
      @if (emailInvalid) {
        <span class="form-error">請輸入有效的電子郵件地址</span>
      }
    </div>

    <!-- Password -->
    <div class="form-field" [class.has-error]="passwordInvalid" [class.has-value]="form.controls.password.value">
      <label class="form-label" for="password">密碼</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0110 0v4" />
        </svg>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <button type="button" class="toggle-password" (click)="togglePassword()" tabindex="-1">
          @if (showPassword()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (passwordInvalid) {
        <span class="form-error">密碼至少需要 6 個字元</span>
      }
    </div>

    <!-- Options row -->
    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="rememberMe" />
        <span class="checkbox-box">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 5l2.5 2.5L8 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="checkbox-text">記住我</span>
      </label>
      <a class="forgot-link" routerLink="/auth/forgot-password">忘記密碼？</a>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-login" [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner"></span>
        <span>登入中…</span>
      } @else {
        <span>登入帳戶</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
    </button>
  </form>

  <!-- Divider -->
  <div class="login-divider">
    <span>或</span>
  </div>

  <!-- OAuth Buttons -->
  <div class="oauth-buttons">
    <button class="btn-oauth btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      使用 Google 帳號登入
    </button>
    <button class="btn-oauth btn-apple" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
      使用 Apple 帳號登入
    </button>
  </div>

  <!-- Register link -->
  <p class="login-register">
    還沒有帳號？
    <a routerLink="/auth/register">立即註冊</a>
  </p>
</div>
